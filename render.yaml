# render.yaml — Blueprint for Render.com deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: govjobvault-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /swagger-ui.html
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: SHOW_SQL
        value: "false"
      - key: LOG_LEVEL
        value: INFO
